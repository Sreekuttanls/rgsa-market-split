name: Publication checks

on:
  push:
  pull_request:

jobs:
  lightweight-validation:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.12']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime dependency
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate committed benchmark artifact
        run: python -m src.validate_publication
      - name: Verify manuscript-facing claims
        run: python -m src.verify_claims
      - name: Run publication smoke checks
        run: python -m src.publication_smoke
