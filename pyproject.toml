[build-system]
requires = ["setuptools>=68,<70"]
build-backend = "setuptools.build_meta"

[project]
name = "rgsa-market-split"
version = "1.1.0"
description = "Residual-Guided Simulated Annealing for QOBLIB Market Split instances"
readme = "README.md"
requires-python = ">=3.9,<3.13"
authors = [
  { name = "Sreekuttan L. S." }
]
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy==1.26.4",
]

[project.urls]
Homepage = "https://anonymous.4open.science/r/rgsa-market-split-1F7D/"
Repository = "https://anonymous.4open.science/r/rgsa-market-split-1F7D/"
Issues = "https://anonymous.4open.science/r/rgsa-market-split-1F7D/issues"

[project.scripts]
rgsa-validate = "src.validate_publication:main"
rgsa-verify-claims = "src.verify_claims:main"
rgsa-publication-smoke = "src.publication_smoke:main"

[tool.setuptools]
packages = ["src"]
include-package-data = true
